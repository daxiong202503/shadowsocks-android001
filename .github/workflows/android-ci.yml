name: Android CI/CD

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置 JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: 设置 Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools: 34.0.0
        ndk-version: 25.1.8937393
        
    - name: 设置 Gradle 缓存
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.android/build-cache
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: 授予 Gradlew 执行权限
      run: chmod +x gradlew
      
    - name: 构建 Debug APK
      run: ./gradlew assembleDebug
      
    - name: 构建 Release APK
      run: ./gradlew assembleRelease
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        
    - name: 运行测试
      run: ./gradlew test
      
    - name: 上传 Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: shadowsocks-android-debug
        path: app/build/outputs/apk/debug/*.apk
        
    - name: 上传 Release APK
      uses: actions/upload-artifact@v4
      with:
        name: shadowsocks-android-release
        path: app/build/outputs/apk/release/*.apk
        
    - name: 生成构建报告
      run: |
        echo "## 构建报告" >> $GITHUB_STEP_SUMMARY
        echo "- Debug APK: ✅ 构建成功" >> $GITHUB_STEP_SUMMARY
        echo "- Release APK: ✅ 构建成功" >> $GITHUB_STEP_SUMMARY
        echo "- 测试: ✅ 通过" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "构建产物已上传到 Artifacts，可在 Actions 页面下载。" >> $GITHUB_STEP_SUMMARY

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    
    steps:
    - name: 下载 Release APK
      uses: actions/download-artifact@v4
      with:
        name: shadowsocks-android-release
        path: ./release
        
    - name: 创建 Release
      uses: softprops/action-gh-release@v1
      with:
        files: ./release/*.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
