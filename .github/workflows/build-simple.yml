name: Shadowsocks Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
        - release
        - debug
        - test

env:
  SHADOWSOCKS_VERSION: ${{ github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        include:
          - platform: linux-amd64
            arch: x86_64
          - platform: linux-arm64
            arch: aarch64
          - platform: linux-arm
            arch: armv7l
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
        
    - name: Set up environment
      run: |
        echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
        echo "GIT_COMMIT=${{ github.sha }}" >> $GITHUB_ENV
        echo "VERSION=${SHADOWSOCKS_VERSION:-dev}" >> $GITHUB_ENV
        
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          autotools-dev \
          automake \
          libtool \
          pkg-config \
          libssl-dev \
          libpcre3-dev \
          libev-dev \
          libc-ares-dev \
          libsodium-dev \
          libmbedtls-dev \
          libudns-dev \
          libcap-dev \
          libsystemd-dev \
          libpam0g-dev \
          liblz4-dev \
          libzstd-dev \
          libnghttp2-dev \
          libevent-dev \
          git \
          wget \
          curl
          
    - name: Setup cross-compilation (for ARM)
      if: matrix.platform != 'linux-amd64'
      run: |
        sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
        sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
        
    - name: Clone Shadowsocks source
      run: |
        if [ ! -d "shadowsocks-libev" ]; then
          echo "Cloning Shadowsocks source..."
          git clone --depth 1 https://github.com/shadowsocks/shadowsocks-libev.git
          cd shadowsocks-libev
          git submodule update --init --recursive
        else
          echo "Using existing Shadowsocks source..."
          cd shadowsocks-libev
          git pull origin master
          git submodule update --init --recursive
        fi
        
    - name: Configure build
      run: |
        cd shadowsocks-libev
        
        # Set cross-compilation environment
        if [ "${{ matrix.platform }}" = "linux-arm64" ]; then
          export CC=aarch64-linux-gnu-gcc
          export CXX=aarch64-linux-gnu-g++
          export AR=aarch64-linux-gnu-ar
          export RANLIB=aarch64-linux-gnu-ranlib
          export STRIP=aarch64-linux-gnu-strip
        elif [ "${{ matrix.platform }}" = "linux-arm" ]; then
          export CC=arm-linux-gnueabihf-gcc
          export CXX=arm-linux-gnueabihf-g++
          export AR=arm-linux-gnueabihf-ar
          export RANLIB=arm-linux-gnueabihf-ranlib
          export STRIP=arm-linux-gnueabihf-strip
        fi
        
        # Generate configure script
        ./autogen.sh
        
        # Configure with optimizations
        ./configure \
          --disable-documentation \
          --enable-static \
          --with-crypto-library=mbedtls \
          --prefix=/usr/local
          
    - name: Build Shadowsocks
      run: |
        cd shadowsocks-libev
        make -j$(nproc)
        
    - name: Run tests
      if: github.event.inputs.build_type != 'debug'
      run: |
        cd shadowsocks-libev
        make check || echo "Tests failed, but continuing..."
        
    - name: Install binaries
      run: |
        cd shadowsocks-libev
        make install DESTDIR=/tmp/shadowsocks-install
        
    - name: Create package
      run: |
        mkdir -p dist/${{ matrix.platform }}
        
        # Copy binaries
        cp /tmp/shadowsocks-install/usr/local/bin/ss-* dist/${{ matrix.platform }}/ 2>/dev/null || true
        
        # Create version info
        cat > dist/${{ matrix.platform }}/version.txt << EOF
Shadowsocks-libev Build Information
==================================
Version: ${{ env.VERSION }}
Build Date: ${{ env.BUILD_DATE }}
Git Commit: ${{ env.GIT_COMMIT }}
Platform: ${{ matrix.platform }}
Architecture: ${{ matrix.arch }}
Build Type: ${{ github.event.inputs.build_type || 'release' }}
EOF
        
        # Create README
        cat > dist/${{ matrix.platform }}/README.md << EOF
# Shadowsocks-libev ${{ matrix.platform }}

This package contains pre-built Shadowsocks-libev binaries for ${{ matrix.platform }}.

## Binaries included:
- ss-server: Shadowsocks server
- ss-local: Shadowsocks local client
- ss-manager: Shadowsocks manager
- ss-tunnel: Shadowsocks tunnel
- ss-nat: Shadowsocks NAT
- ss-redir: Shadowsocks redirector
- ss-rules: Shadowsocks rules

## Usage:
1. Make binaries executable: \`chmod +x ss-*\`
2. Configure and run: \`./ss-server -c config.json\`

## Build Information:
- Version: ${{ env.VERSION }}
- Build Date: ${{ env.BUILD_DATE }}
- Git Commit: ${{ env.GIT_COMMIT }}
EOF
        
        # List files
        ls -la dist/${{ matrix.platform }}/
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: shadowsocks-${{ matrix.platform }}
        path: dist/${{ matrix.platform }}/
        retention-days: 30
        
    - name: Create checksums
      run: |
        cd dist/${{ matrix.platform }}
        find . -type f -name "ss-*" -exec sha256sum {} \; > checksums.txt
        cat checksums.txt
        
    - name: Upload checksums
      uses: actions/upload-artifact@v4
      with:
        name: checksums-${{ matrix.platform }}
        path: dist/${{ matrix.platform }}/checksums.txt
        retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Create release archive
      run: |
        mkdir -p release
        for dir in shadowsocks-*; do
          if [ -d "$dir" ]; then
            platform=$(echo $dir | sed 's/shadowsocks-//')
            tar -czf "release/shadowsocks-${{ env.VERSION }}-$platform.tar.gz" -C "$dir" .
            echo "Created: shadowsocks-${{ env.VERSION }}-$platform.tar.gz"
          fi
        done
        
        # Create combined archive
        tar -czf "release/shadowsocks-${{ env.VERSION }}-all.tar.gz" shadowsocks-*
        
        ls -la release/
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: release/*
        tag_name: ${{ github.ref_name }}
        name: Shadowsocks ${{ github.ref_name }}
        body: |
          ## Shadowsocks-libev ${{ github.ref_name }}
          
          Pre-built binaries for multiple platforms.
          
          ### Downloads:
          - `shadowsocks-${{ env.VERSION }}-all.tar.gz` - All platforms
          - `shadowsocks-${{ env.VERSION }}-linux-amd64.tar.gz` - Linux x86_64
          - `shadowsocks-${{ env.VERSION }}-linux-arm64.tar.gz` - Linux ARM64
          - `shadowsocks-${{ env.VERSION }}-linux-arm.tar.gz` - Linux ARM
          
          ### Installation:
          1. Download the appropriate archive for your platform
          2. Extract: `tar -xzf shadowsocks-*.tar.gz`
          3. Make executable: `chmod +x ss-*`
          4. Configure and run: `./ss-server -c config.json`
          
          ### Build Information:
          - Build Date: ${{ env.BUILD_DATE }}
          - Git Commit: ${{ env.GIT_COMMIT }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
